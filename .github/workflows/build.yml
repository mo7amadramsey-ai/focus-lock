name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write   # needed to publish a Release
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      # Flutter is PINNED to 3.47.x. Builds up to 2026-11-15 (which installed fine) used the 3.47 line;
      # 'channel: stable' silently jumped to 3.50 (released 2026-11-11) and later builds stopped installing.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.x'
          cache: true
      - run: flutter --version
      # Generate the Android scaffolding (existing files are kept)
      - run: flutter create --platforms=android --org com.mohammed --project-name focus_lock .
      # Overlay our native code, manifest and resources
      - run: cp -r android_overlay/* android/
      - run: flutter pub get
      # A lint crash inside a dependency (video_player_android) broke the build; lint is not needed for the APK
      - name: Disable lintVital tasks
        run: |
          mkdir -p ~/.gradle/init.d
          printf 'allprojects { tasks.configureEach { t -> if (t.name.startsWith("lintVital")) t.enabled = false } }\n' > ~/.gradle/init.d/skip-lint.gradle
      # Fail early (and clearly) if the permanent signing key is missing.
      # Never fall back to a debug key: that is what produced "package conflicts / appears invalid" on updates.
      - name: Check signing secrets exist
        env:
          KS_B64: ${{ secrets.FL_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.FL_KEYSTORE_PASS }}
        shell: bash
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ]; then
            echo "::error::Secrets FL_KEYSTORE_B64 / FL_KEYSTORE_PASS are missing or empty. Refusing to publish an APK signed with a different key."
            exit 1
          fi
      # Two files with the SAME versionCode: the universal APK (all phones, ~65 MB) and a SMALL arm64 APK (~30 MB, almost every
      # phone made after 2017). A smaller file downloads and installs much more reliably on a weak connection.
      - name: Build APKs
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --release --build-number=${{ github.run_number }} 2>&1 | tee build.log
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/app-release.apk
          flutter build apk --release --target-platform android-arm64 --build-number=${{ github.run_number }} 2>&1 | tee -a build.log
          cp build/app/outputs/flutter-apk/app-release.apk dist/app-arm64-release.apk
      # Re-sign with the PERMANENT key (stored in repo secrets) so every build can update the previous one.
      - name: Sign APK with the permanent key
        env:
          KS_B64: ${{ secrets.FL_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.FL_KEYSTORE_PASS }}
        shell: bash
        run: |
          set -euo pipefail
          echo "$KS_B64" | base64 -d > /tmp/fl.jks
          AS=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          for APK in dist/*.apk; do
            "$AS" sign --ks /tmp/fl.jks --ks-key-alias focuslock --ks-pass env:KS_PASS --key-pass env:KS_PASS \
              --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true "$APK"
          done
          rm -f /tmp/fl.jks
      # Validate the final APK. The build fails here instead of shipping a broken package.
      - name: Verify APK (signature, alignment, manifest)
        shell: bash
        run: |
          set -euo pipefail
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          FV=$(flutter --version | head -1)
          echo "### APK check" | tee -a "$GITHUB_STEP_SUMMARY" release_notes.md
          echo "- Flutter: \`$FV\`" | tee -a "$GITHUB_STEP_SUMMARY" release_notes.md
          echo "- **app-arm64-release.apk** is the small file (recommended for almost every phone). **app-release.apk** works on every phone." | tee -a "$GITHUB_STEP_SUMMARY" release_notes.md
          for APK in dist/*.apk; do
            N=$(basename "$APK")
            echo "== $N: apksigner verify =="
            "$BT/apksigner" verify --verbose --print-certs "$APK" | tee verify.txt
            grep -q "Verifies" verify.txt
            "$BT/zipalign" -c 4 "$APK" && echo "aligned OK"
            "$BT/aapt" dump badging "$APK" | grep -E "^package:|^sdkVersion|^targetSdkVersion" | tee badging.txt
            unzip -tq "$APK"
            CERT=$(grep -m1 "SHA-256 digest" verify.txt | sed 's/.*: //')
            SHA=$(sha256sum "$APK" | cut -d' ' -f1)
            SZ=$(du -h "$APK" | cut -f1)
            {
              echo "- \`$N\` ($SZ) SHA-256: \`$SHA\`"
              echo "  - signing cert SHA-256: \`$CERT\` (must be IDENTICAL in every build, otherwise updates fail)"
            } | tee -a "$GITHUB_STEP_SUMMARY" release_notes.md
          done
      # On failure, publish the error lines to a 'buildlog' branch so they can be read
      - name: Publish build log on failure
        if: failure()
        run: |
          mkdir /tmp/bl
          grep -nE "Error|error:|FAILURE|What went wrong|lib/" build.log | head -80 > /tmp/bl/errors.txt || true
          tail -n 120 build.log > /tmp/bl/tail.txt || true
          [ -f verify.txt ] && cp verify.txt /tmp/bl/verify.txt || true
          git config user.name github-actions
          git config user.email actions@github.com
          git checkout --orphan buildlog
          git rm -rf . -q
          cp /tmp/bl/* .
          git add .
          git commit -qm "build log"
          git push -f origin buildlog
      - uses: actions/upload-artifact@v4
        with:
          name: focus-lock-apk
          path: dist/*.apk
      # Publish the APK as a GitHub Release (visible in the repo's "Releases" section).
      # Only from main: experimental branches must never become the "latest" release users install.
      - uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Focus Lock v1.0.${{ github.run_number }}
          body_path: release_notes.md
          files: |
            dist/app-release.apk
            dist/app-arm64-release.apk
          make_latest: true
