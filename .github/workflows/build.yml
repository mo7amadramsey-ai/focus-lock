name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write   # needed to publish a Release
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      # Generate the Android scaffolding (existing files are kept)
      - run: flutter create --platforms=android --org com.mohammed --project-name focus_lock .
      # Overlay our native code, manifest and resources
      - run: cp -r android_overlay/* android/
      - run: flutter pub get
      - name: Build APK
        run: flutter build apk --release --build-number=${{ github.run_number }} 2>&1 | tee build.log
        shell: bash
      # Re-sign with the PERMANENT key (stored in repo secrets) so every build can update the previous one.
      # Without this each CI run used a fresh random debug key -> "package appears invalid" on update.
      - name: Sign APK with the permanent key
        env:
          KS_B64: ${{ secrets.FL_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.FL_KEYSTORE_PASS }}
        shell: bash
        run: |
          echo "$KS_B64" | base64 -d > /tmp/fl.jks
          AS=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          APK=build/app/outputs/flutter-apk/app-release.apk
          "$AS" sign --ks /tmp/fl.jks --ks-key-alias focuslock --ks-pass env:KS_PASS --key-pass env:KS_PASS "$APK"
          "$AS" verify --print-certs "$APK" | head -3
          rm -f /tmp/fl.jks
      # Re-sign with the PERMANENT key (stored in repo secrets) so every build can update the previous one
      - name: Sign APK with permanent key
        env:
          KS_B64: ${{ secrets.FL_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.FL_KEYSTORE_PASS }}
        run: |
          echo "$KS_B64" | base64 -d > /tmp/fl.jks
          AS=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          $AS sign --ks /tmp/fl.jks --ks-key-alias focuslock --ks-pass env:KS_PASS --key-pass env:KS_PASS build/app/outputs/flutter-apk/app-release.apk
          $AS verify --print-certs build/app/outputs/flutter-apk/app-release.apk | head -3
          rm -f /tmp/fl.jks
      # On failure, publish the error lines to a 'buildlog' branch so they can be read
      - name: Publish build log on failure
        if: failure()
        run: |
          mkdir /tmp/bl
          grep -nE "Error|error:|FAILURE|What went wrong|lib/" build.log | head -80 > /tmp/bl/errors.txt || true
          tail -n 120 build.log > /tmp/bl/tail.txt || true
          git config user.name github-actions
          git config user.email actions@github.com
          git checkout --orphan buildlog
          git rm -rf . -q
          cp /tmp/bl/errors.txt /tmp/bl/tail.txt .
          git add errors.txt tail.txt
          git commit -qm "build log"
          git push -f origin buildlog
      - uses: actions/upload-artifact@v4
        with:
          name: focus-lock-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      # Publish the APK as a GitHub Release (visible in the repo's "Releases" section)
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Focus Lock v1.0.${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
          make_latest: true
