name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      # Generate the Android scaffolding (existing files are kept)
      - run: flutter create --platforms=android --org com.mohammed --project-name focus_lock .
      # Overlay our native code, manifest and resources
      - run: cp -r android_overlay/* android/
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: focus-lock-apk
          path: build/app/outputs/flutter-apk/app-release.apk
