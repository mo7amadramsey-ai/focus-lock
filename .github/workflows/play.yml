name: Build Google Play bundle
# Manual only (Actions -> "Build Google Play bundle" -> Run workflow). Produces:
#   - focus-lock-play.aab : the bundle to upload to Play Console (signed with the upload key = the project key)
#   - focus-lock-play-test.apk : the SAME code as an APK, to test on a phone before uploading
# The Play build has no YouTube downloading / stream extraction, no accessibility-service or device-admin lock
# (it uses Android screen pinning), and none of the restricted permissions. See docs/PLAY_STORE.md.
on:
  workflow_dispatch:
  push:
    branches: [play-build]   # pushing this branch also builds the Play bundle
permissions:
  contents: write   # only to publish the failure log branch
jobs:
  play:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.x'
          cache: true
      - run: flutter --version
      - run: flutter create --platforms=android --org com.mohammed --project-name focus_lock .
      - run: cp -r android_overlay/* android/
      # Play manifest: remove restricted permissions and the lock components
      - run: python3 tools/play_manifest.py android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - name: Disable lintVital tasks
        run: |
          mkdir -p ~/.gradle/init.d
          printf 'allprojects { tasks.configureEach { t -> if (t.name.startsWith("lintVital")) t.enabled = false } }\n' > ~/.gradle/init.d/skip-lint.gradle
      - name: Check signing secrets exist
        env:
          KS_B64: ${{ secrets.FL_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.FL_KEYSTORE_PASS }}
        shell: bash
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ]; then echo "::error::signing secrets missing"; exit 1; fi
      - name: Build bundle and test APK
        shell: bash
        run: |
          set -o pipefail
          flutter build appbundle --release --dart-define=PLAY=true --build-number=${{ github.run_number }} 2>&1 | tee build.log
          flutter build apk --release --dart-define=PLAY=true --target-platform android-arm64 --build-number=${{ github.run_number }} 2>&1 | tee -a build.log
          mkdir -p dist
          cp build/app/outputs/bundle/release/app-release.aab dist/focus-lock-play.aab
          cp build/app/outputs/flutter-apk/app-release.apk dist/focus-lock-play-test.apk
      - name: Sign
        env:
          KS_B64: ${{ secrets.FL_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.FL_KEYSTORE_PASS }}
        shell: bash
        run: |
          set -euo pipefail
          echo "$KS_B64" | base64 -d > /tmp/fl.jks
          AS=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          "$AS" sign --ks /tmp/fl.jks --ks-key-alias focuslock --ks-pass env:KS_PASS --key-pass env:KS_PASS \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true dist/focus-lock-play-test.apk
          # a bundle is signed with jarsigner (remove any signature Flutter added first)
          zip -q -d dist/focus-lock-play.aab 'META-INF/*' || true
          jarsigner -keystore /tmp/fl.jks -storepass "$KS_PASS" -keypass "$KS_PASS" -sigalg SHA256withRSA -digestalg SHA-256 dist/focus-lock-play.aab focuslock
          rm -f /tmp/fl.jks
      - name: Verify
        shell: bash
        run: |
          set -euo pipefail
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --verbose --print-certs dist/focus-lock-play-test.apk | tee verify.txt
          grep -q "Verifies" verify.txt
          "$BT/zipalign" -c 4 dist/focus-lock-play-test.apk
          echo "== permissions in the Play build =="
          "$BT/aapt" dump permissions dist/focus-lock-play-test.apk | tee perms.txt
          if grep -E "MANAGE_EXTERNAL_STORAGE|ANSWER_PHONE_CALLS|READ_PHONE_STATE|HIDE_OVERLAY_WINDOWS|BIND_ACCESSIBILITY_SERVICE|BIND_DEVICE_ADMIN" perms.txt; then echo "::error::restricted permission found in the Play build"; exit 1; fi
          unzip -tq dist/focus-lock-play.aab
          jarsigner -verify dist/focus-lock-play.aab | head -3
          sha256sum dist/* | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: focus-lock-play
          path: dist/*
      - name: Publish build log on failure
        if: failure()
        run: |
          mkdir /tmp/bl
          grep -nE "Error|error:|FAILURE|What went wrong|lib/" build.log | head -80 > /tmp/bl/errors.txt || true
          tail -n 120 build.log > /tmp/bl/tail.txt || true
          git config user.name github-actions
          git config user.email actions@github.com
          git checkout --orphan buildlog-play
          git rm -rf . -q
          cp /tmp/bl/* .
          git add .
          git commit -qm "play build log"
          git push -f origin buildlog-play
